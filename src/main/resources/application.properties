spring.application.name=bankingApp
spring.profiles.default=local
server.port=5050
server.address=127.0.0.1
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.datasource.url=jdbc:postgresql://localhost:5432/bankingData
spring.datasource.username=bankAppAdmin
# Database password and initial staff credentials belong in application-local.properties.

#Turns off SpringBoot Banner
spring.main.banner-mode=OFF
logging.level.root=warn

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Add logging configs to display SQL statements
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=off

spring.security.user.name=
spring.security.user.password=


#Bank Details
bank.routing-number = 91000019
