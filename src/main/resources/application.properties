spring.application.name=bankingApp
spring.profiles.default=local
server.port=5050
server.address=127.0.0.1
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
# Lax permits Google's top-level GET callback to carry the login session; CSRF remains enabled.
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.datasource.url=${BANK_DB_URL:jdbc:postgresql://localhost:5432/bankingData}
spring.datasource.username=${BANK_DB_USERNAME:bankAppAdmin}
spring.datasource.password=${BANK_DB_PASSWORD:}
# Spring dotenv loads private values from .env in the working directory.

#Turns off SpringBoot Banner
spring.main.banner-mode=OFF
logging.level.root=warn

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Add logging configs to display SQL statements
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=off

spring.security.user.name=${BANK_SECURITY_REP_USERNAME:}
spring.security.user.password=${BANK_SECURITY_REP_PASSWORD:}
bank.security.admin.username=${BANK_SECURITY_ADMIN_USERNAME:}
bank.security.admin.password=${BANK_SECURITY_ADMIN_PASSWORD:}

# Enable in .env after configuring a Google OAuth client.
bank.security.google.enabled=${BANK_SECURITY_GOOGLE_ENABLED:false}
bank.security.google.client-id=${BANK_SECURITY_GOOGLE_CLIENT_ID:}
bank.security.google.client-secret=${BANK_SECURITY_GOOGLE_CLIENT_SECRET:}

# Exact browser origins allowed to send credentials; use the same hostname for frontend and API.
bank.security.frontend-origins=http://localhost:5173,http://127.0.0.1:5173


#Bank Details
bank.routing-number = 91000019
