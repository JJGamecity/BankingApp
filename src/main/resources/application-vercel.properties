server.address=0.0.0.0
server.port=${PORT:3000}
server.servlet.context-path=/api
# Vercel terminates HTTPS before forwarding requests to the container.
server.ssl.enabled=false
server.ssl.key-store=
server.ssl.key-store-password=
server.forward-headers-strategy=framework
bank.security.frontend-origins=${BANK_FRONTEND_ORIGIN:https://jj-banking-app.vercel.app}
spring.datasource.url=jdbc:postgresql://${PGHOST}/${PGDATABASE}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
