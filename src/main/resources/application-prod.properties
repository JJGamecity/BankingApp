# Enable with SPRING_PROFILES_ACTIVE=prod after provisioning the schema and a database ADMIN.
bank.security.configured-logins-enabled=false
spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.cookie.secure=true
server.ssl.enabled=true
server.ssl.key-store=${BANK_TLS_KEYSTORE}
server.ssl.key-store-password=${BANK_TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
